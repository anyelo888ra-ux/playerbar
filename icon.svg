<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  
  <rect width="200" height="200" rx="40" fill="url(#bg)"/>
  
  <!-- Disco -->
  <circle cx="100" cy="100" r="60" fill="#111" stroke="#333" stroke-width="2"/>
  <circle cx="100" cy="100" r="40" fill="none" stroke="#222" stroke-width="1"/>
  <circle cx="100" cy="100" r="20" fill="url(#accent)" stroke="#fff" stroke-width="2"/>
  
  <!-- Ballena (Logo) -->
  <path d="M 90 105 Q 100 112 110 105" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <circle cx="93" cy="98" r="3" fill="#fff"/>
  
  <!-- Barra de progreso -->
  <rect x="40" y="170" width="120" height="6" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="40" y="170" width="60" height="6" rx="3" fill="url(#accent)"/>
  
  <!-- Texto -->
  <text x="100" y="155" font-family="Arial, sans-serif" font-weight="900" font-size="14" fill="#fff" text-anchor="middle" letter-spacing="2">PLAYERBAR</text>
</svg>
