<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bgBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="100%" stop-color="#00ffff"/>
    </linearGradient>
  </defs>
  
  <rect width="800" height="200" fill="url(#bgBanner)"/>
  
  <!-- Rejilla de fondo -->
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00ffff" stroke-width="1" opacity="0.05"/>
  </pattern>
  <rect width="800" height="200" fill="url(#grid)"/>
  
  <!-- Disco girando -->
  <g transform="translate(150, 100)">
    <circle cx="0" cy="0" r="60" fill="#111" stroke="#333" stroke-width="2"/>
    <circle cx="0" cy="0" r="45" fill="none" stroke="#222" stroke-width="1"/>
    <circle cx="0" cy="0" r="20" fill="#3b82f6" stroke="#fff" stroke-width="3"/>
    <path d="M -10 5 Q 0 12 10 5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
    <circle cx="-5" cy="-2" r="2" fill="#fff"/>
  </g>
  
  <!-- Texto -->
  <text x="260" y="100" font-family="Arial, sans-serif" font-weight="900" font-size="60" fill="url(#textGrad)" letter-spacing="-2">PlayerBar</text>
  <text x="260" y="135" font-family="monospace" font-weight="bold" font-size="16" fill="#94a3b8" letter-spacing="2">LOFI WIDGET FOR OBS</text>
  
  <!-- Barra de progreso decorativa -->
  <rect x="260" y="155" width="300" height="4" rx="2" fill="rgba(255,255,255,0.1)"/>
  <rect x="260" y="155" width="150" height="4" rx="2" fill="#00ffff"/>
</svg>
